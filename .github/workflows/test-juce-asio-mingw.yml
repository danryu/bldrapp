# PROBE (manual): can JUCE with Steinberg ASIO enabled compile on Windows with
# mingw64? JUCE 8 dropped MinGW for juceaide/examples, so this builds a tiny
# modules-only probe (juce-mingw-probe/) that links juce_audio_devices + ASIO.
# Read the logs, fix what breaks, repeat.
name: TEST - JUCE ASIO on MinGW64

on:
  workflow_dispatch:
    inputs:
      juce_ref:
        description: 'JUCE branch/tag (blank = 8.0.4)'
        required: false
        default: '8.0.4'

jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout bldrapp
        uses: actions/checkout@v4

      - name: Setup MSYS2 (MinGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            unzip
            curl
          pacboy: >-
            toolchain:p
            cmake:p
            ninja:p

      - name: Clone JUCE
        run: |
          set -euo pipefail
          ref="${{ github.event.inputs.juce_ref }}"
          if [ -z "$ref" ]; then ref="8.0.4"; fi
          git clone --depth 1 --branch "$ref" https://github.com/juce-framework/JUCE.git
          cd JUCE
          git submodule update --init --recursive

      - name: Download Steinberg ASIO SDK
        run: |
          set -euo pipefail
          curl -fsSL -o asio.zip \
            "https://download.steinberg.net/sdk_downloads/asiosdk_2.3.3_2019-06-14.zip"
          rm -rf asio_sdk
          unzip -q asio.zip -d asio_sdk
          asio_root="$(find asio_sdk -type d -name common | head -1)"
          if [ -z "$asio_root" ]; then
            echo "Could not locate ASIO SDK common/ directory"
            find asio_sdk
            exit 1
          fi
          echo "ASIO_SDK_COMMON=$asio_root" >> "$GITHUB_ENV"
          echo "Found ASIO SDK at $asio_root"

      - name: Configure modules-only ASIO probe
        run: |
          set -euo pipefail
          cmake -G Ninja -B probe-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DJUCE_SOURCE_DIR="$PWD/JUCE" \
            -DJUCE_MODULES_ONLY=ON \
            -DASIO_SDK_COMMON="$ASIO_SDK_COMMON" \
            juce-mingw-probe

      - name: Build ASIO probe
        run: |
          set -euo pipefail
          cmake --build probe-build --target asio_probe -j"$(nproc)"

      - name: Verify build outputs
        run: |
          set -euo pipefail
          exe="$(find probe-build -maxdepth 4 -name 'asio_probe.exe' | head -1)"
          if [ -z "$exe" ]; then
            echo "asio_probe.exe not found"
            find probe-build -maxdepth 4 -name '*.exe' || true
            exit 1
          fi
          echo "OK: built $exe"
          ls -la "$exe"
