# PROBE (manual): can UPSTREAM gstjitsimeet + its C++23 submodule tree build with
# MSVC, against an official (MSVC) GStreamer release? This establishes a baseline —
# if upstream builds, MSVC support is real and any breakage is fork-specific; if it
# fails, MSVC support must be added at the source. Throwaway diagnostic, EXPECTED to
# fail initially — read the logs, port what breaks, repeat. Defaults to upstream
# (mojyack); flip the inputs to probe the danryu fork once a baseline exists.
name: TEST - gstjitsimeet on MSVC

on:
  workflow_dispatch:
    inputs:
      gstjitsimeet_repo:
        description: 'gstjitsimeet repo (owner/name)'
        required: false
        default: 'mojyack/gstjitsimeet'
      gstjitsimeet_ref:
        description: 'gstjitsimeet branch/ref (blank = repo default)'
        required: false
        default: ''
      submod_repo:
        description: 'submod repo (owner/name)'
        required: false
        default: 'mojyack/submod'
      coop_repo:
        description: 'coop repo (owner/name)'
        required: false
        default: 'mojyack/coop'

jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
    steps:
      - name: Checkout bldrapp (patches + cache key)
        uses: actions/checkout@v4

      - name: Setup MSVC (x64) environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # msvc-dev-cmd points VCPKG_ROOT at VS manifest-mode vcpkg (no classic install).
      # GHA's standalone classic vcpkg lives at C:\vcpkg — use that for port installs + cache.
      - name: Pin vcpkg to runner classic instance
        shell: pwsh
        run: |
          "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
          "VCPKG_INSTALLATION_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
          Write-Host "Using classic vcpkg at C:\vcpkg"

      # x-gha needs these two endpoints exposed as env vars to talk to the cache backend.
      - name: Expose GitHub Actions cache to vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install meson + ninja
        shell: pwsh
        run: pip install meson ninja

      - name: Install pkgconf + GStreamer (official MSVC build)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install -y pkgconfiglite
          # Official GStreamer Windows packages are MSVC x86_64; devel ships headers
          # + lib/pkgconfig. Chocolatey installs to Program Files, not C:\gstreamer.
          choco install -y gstreamer gstreamer-devel
          $gstPc = 'C:\Program Files\gstreamer\1.0\msvc_x86_64\lib\pkgconfig\gstreamer-1.0.pc'
          if (-not (Test-Path $gstPc)) { throw "Missing $gstPc after choco install" }
          Write-Host "Found $gstPc"

      # Cache the compiled install tree (~10 min to rebuild openssl + libwebsockets).
      # x-gha (VCPKG_BINARY_SOURCES) is a second layer; this restore skips vcpkg install
      # entirely on a hit. downloads/ speeds up cache misses only.
      - name: Restore vcpkg openssl + libwebsockets cache
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed\x64-windows
          key: vcpkg-msvc-x64-${{ hashFiles('.github/vcpkg-msvc-deps.txt') }}
          restore-keys: |
            vcpkg-msvc-x64-

      - name: Install openssl + libwebsockets via vcpkg (MSVC)
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vcpkgRoot = 'C:\vcpkg'
          Write-Host "Cache miss — building vcpkg ports at $vcpkgRoot (expect ~10 min)"
          & "$vcpkgRoot\vcpkg.exe" install openssl:x64-windows libwebsockets:x64-windows

      - name: Ensure vcpkg pkg-config files (MSVC)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vcpkgRoot = 'C:\vcpkg'
          if ("${{ steps.vcpkg-cache.outputs.cache-hit }}" -eq 'true') {
            Write-Host "vcpkg cache hit — skipped port build"
          } else {
            Write-Host "vcpkg cache miss — ports were built this run"
          }
          $vcpkgPc = "$vcpkgRoot\installed\x64-windows\lib\pkgconfig"
          $lwsPc = "$vcpkgPc\libwebsockets.pc"
          if (-not (Test-Path "$vcpkgRoot\installed\x64-windows\include\openssl\ssl.h")) {
            throw "openssl not present under $vcpkgRoot\installed\x64-windows (cache corrupt?)"
          }
          if (-not (Test-Path "$vcpkgRoot\installed\x64-windows\include\libwebsockets.h")) {
            throw "libwebsockets not present under $vcpkgRoot\installed\x64-windows (cache corrupt?)"
          }
          if (-not (Test-Path $lwsPc)) {
            # Pre-built vcpkg libwebsockets has no .pc on MSVC; point pkg-config at the install tree.
            $prefix = ($vcpkgRoot + '/installed/x64-windows') -replace '\\', '/'
            $cfg = Get-Content "$vcpkgRoot\installed\x64-windows\include\lws_config.h" -Raw
            if ($cfg -match '#define LWS_LIBRARY_VERSION_MAJOR (\d+)') { $maj = $Matches[1] } else { $maj = '4' }
            if ($cfg -match '#define LWS_LIBRARY_VERSION_MINOR (\d+)') { $min = $Matches[1] } else { $min = '3' }
            if ($cfg -match '#define LWS_LIBRARY_VERSION_PATCH (\d+)') { $pat = $Matches[1] } else { $pat = '0' }
            New-Item -ItemType Directory -Force -Path $vcpkgPc | Out-Null
            @"
          prefix=$prefix
          exec_prefix=`${prefix}
          libdir=`${exec_prefix}/lib
          includedir=`${prefix}/include
          
          Name: libwebsockets
          Description: Websockets server and client library
          Version: $maj.$min.$pat
          Requires: openssl
          Libs: -L`${libdir} -lwebsockets
          Cflags: -I`${includedir}
          "@ | ForEach-Object { $_.TrimStart() } | Set-Content -Path $lwsPc -Encoding ascii
            Write-Host "Wrote $lwsPc"
          } else {
            Write-Host "Found $lwsPc"
          }
          $env:PKG_CONFIG_PATH = $vcpkgPc
          foreach ($pkg in @('openssl','libwebsockets')) {
            $ver = pkg-config --modversion $pkg
            if ($LASTEXITCODE -ne 0) { throw "pkg-config failed for $pkg" }
            Write-Host "$pkg = $ver"
          }

      - name: Save vcpkg installed tree to cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\vcpkg\installed\x64-windows
          key: vcpkg-msvc-x64-${{ hashFiles('.github/vcpkg-msvc-deps.txt') }}

      # submod + git operations need bash; symlinks must be real (the submodule tree
      # uses git-tracked symlinks). Cloning needs no toolchain.
      - name: Clone gstjitsimeet + submodule tree
        shell: bash
        run: |
          set -e
          export MSYS=winsymlinks:nativestrict
          git config --global core.symlinks true
          GSTJ_REF='${{ github.event.inputs.gstjitsimeet_ref }}'
          if [ -n "${GSTJ_REF}" ]; then GSTJ_BRANCH=(-b "${GSTJ_REF}"); else GSTJ_BRANCH=(); fi
          git clone -c core.symlinks=true "${GSTJ_BRANCH[@]}" "https://github.com/${{ github.event.inputs.gstjitsimeet_repo }}.git" gstjitsimeet
          cd gstjitsimeet
          # submod populates submodules/ from this repo's own submodules.txt (whatever
          # deps/revs upstream pins). coop is a separate pkg-config dep built below.
          mkdir -p deps && cd deps
          git clone "https://github.com/${{ github.event.inputs.submod_repo }}.git" submod
          git clone "https://github.com/${{ github.event.inputs.coop_repo }}.git" coop
          cd ..
          ./deps/submod/submod clone
          # libjitsimeet keeps nested submodules/ for its in-tree symlinks (ws, xml, …).
          if [ -f submodules/libjitsimeet/submodules.txt ] && [ ! -d submodules/libjitsimeet/submodules/crypto-utils ]; then
            (cd submodules/libjitsimeet && ../../deps/submod/submod clone)
          fi
          echo "Submodule tree:"; ls -la submodules/

      # The source tree is stitched together from git-tracked symlinks (src/jitsi,
      # src/gstutil, and libjitsimeet's nested src/crypto|json|macros|util|ws|xml).
      # git-for-windows checks these out BEFORE their submodule targets exist, so it
      # can't tag them as directory links and creates *file-type* symlinks that point
      # at directories. PowerShell/Test-Path can traverse children through such links
      # (so meson configure succeeds), but ninja's Win32 stat cannot -> the depscan
      # step reports "'../src/jitsi/async-websocket.cpp' ... missing". Dereference-copy
      # the whole tree into real directories so every build tool sees plain files.
      # (Targets all exist by now: submod clone ran above.)
      - name: Materialize source tree (deref symlinks into real files)
        shell: bash
        run: |
          set -e
          cd gstjitsimeet
          rm -rf src/jitsi src/gstutil
          cp -RL submodules/libjitsimeet/src src/jitsi
          cp -RL submodules/gstreamer-utils/src src/gstutil
          # Fail loudly here rather than deep in ninja if a link didn't resolve.
          for f in async-websocket.cpp macros/unwrap.hpp crypto/base64.cpp ws/meson.build xml/meson.build json/meson.build; do
            test -f "src/jitsi/$f" || { echo "MISSING after deref-copy: src/jitsi/$f"; exit 1; }
          done
          echo "real source tree OK:"; ls -la src/jitsi | head
          # Nested serde symlinks (xml/xml, json/json, util) duplicate headers after
          # cp -RL; format.hpp includes already point at the top-level jitsi tree.
          rm -rf src/jitsi/jingle/serde/xml/xml src/jitsi/jingle/serde/xml/util
          rm -rf src/jitsi/jingle/serde/json/json
          # ws/ also materializes nested macros/ + util/ copies; Meson adds the source
          # directory to the include path so ws/*.cpp picks those up instead of the
          # patched top-level src/jitsi/{macros,util} tree (MDd/debug-CRT mismatch).
          rm -rf src/jitsi/ws/macros src/jitsi/ws/util
          echo "removed nested serde + ws symlink copies"

      # coop pins cpp_std=c++23 and GCC-only warning flags; MSVC needs c++latest
      # and cl-compatible options (same class of fix as gstjitsimeet below).
      - name: Patch coop meson.build flags for MSVC (probe-time)
        shell: bash
        run: |
          cd gstjitsimeet/deps/coop
          python - <<'PY'
          path = 'meson.build'
          gcc_flags = ["'-Wfatal-errors'", "'-Wno-missing-field-initializers'"]
          out, inserted = [], False
          for ln in open(path, encoding='utf-8').read().splitlines():
              if 'add_project_arguments' in ln and any(f in ln for f in gcc_flags):
                  if not inserted:
                      out += [
                          "cpp_compiler = meson.get_compiler('cpp')",
                          "if cpp_compiler.get_id() == 'msvc'",
                          "  add_project_arguments(['/W3', '/DNOMINMAX'], language: 'cpp')",
                          "else",
                          "  add_project_arguments('-Wfatal-errors', language: 'cpp')",
                          "  add_project_arguments('-Wno-missing-field-initializers', language: 'cpp')",
                          "endif",
                      ]
                      inserted = True
                  continue
              out.append(ln)
          open(path, 'w', encoding='utf-8').write('\n'.join(out) + '\n')
          print('patched coop meson.build' if inserted else 'NO MATCH — coop meson.build changed upstream')
          PY
          # Windows header mistakenly pulls POSIX unistd.h; runner uses Winsock instead.
          python - <<'PY'
          path = 'include/coop/thread-event-windows.hpp'
          text = open(path, encoding='utf-8').read()
          text = text.replace('#include <unistd.h>\n\n', '')
          open(path, 'w', encoding='utf-8').write(text)
          print('patched coop thread-event-windows.hpp')
          PY
          echo "--- coop meson.build (top) ---"; head -15 meson.build

      - name: Build coop (MSVC)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cd gstjitsimeet/deps/coop
          $prefix = "$env:GITHUB_WORKSPACE\gstjitsimeet\deps\coop-install"
          # MSVC meson backend accepts c++latest, not c++23.
          meson setup build --buildtype=release --default-library=static --prefix="$prefix" -Dcpp_std=c++latest
          meson install -C build
          Get-ChildItem "$prefix\lib\pkgconfig"

      # Make the GCC/Clang-only flags compiler-conditional so the probe reaches actual
      # source compilation under MSVC. This transform is what we would upstream into
      # gstjitsimeet/meson.build if the probe succeeds.
      - name: Patch gstjitsimeet meson.build flags for MSVC (probe-time)
        shell: bash
        run: |
          cd gstjitsimeet
          python - <<'PY'
          path = 'meson.build'
          gcc_flags = ['-Wfatal-errors', '-fpermissive', '-Wno-narrowing',
                       '-Wno-missing-field-initializers', '-std=c++23']
          out, inserted = [], False
          for ln in open(path, encoding='utf-8').read().splitlines():
              if 'add_project_arguments' in ln and any(f"'{f}'" in ln for f in gcc_flags):
                  if not inserted:
                      out += [
                          "cpp_compiler = meson.get_compiler('cpp')",
                          "if cpp_compiler.get_id() == 'msvc'",
                          "  add_project_arguments(['/std:c++latest', '/permissive-', '/Zc:preprocessor', '/EHsc', '/bigobj', '/DNOMINMAX', '/D_ITERATOR_DEBUG_LEVEL=0', '/MD'], language : 'cpp')",
                          "  add_project_link_arguments('/NODEFAULTLIB:LIBCMTD', language: 'cpp')",
                          "  add_project_link_arguments('/NODEFAULTLIB:MSVCRTD', language: 'cpp')",
                          "else",
                          "  add_project_arguments(['-Wfatal-errors', '-fpermissive', '-Wno-narrowing', '-Wno-missing-field-initializers', '-std=c++23'], language : 'cpp')",
                          "endif",
                      ]
                      inserted = True
                  continue
              out.append(ln)
          open(path, 'w', encoding='utf-8').write('\n'.join(out) + '\n')
          print('patched' if inserted else 'NO MATCH — meson.build flags changed')
          PY
          # props.cpp includes jitsi headers ("macros/…") but lives under src/; examples
          # pull in gstutil macros too — skip both for the plugin-only MSVC probe.
          python - <<'PY'
          import re
          path = 'meson.build'
          text = open(path, encoding='utf-8').read()
          text = re.sub(
              r"\n# examples\n.*",
              "\n",
              text,
              count=1,
              flags=re.S,
          )
          old = "  ) + libjitsimeet_src,\n  dependencies : deps + libjitsimeet_deps,"
          new = (
              "  ) + libjitsimeet_src,\n"
              "  include_directories : include_directories('src/jitsi'),\n"
              "  dependencies : deps + libjitsimeet_deps,"
          )
          if old not in text:
              raise SystemExit('meson.build plugin stanza changed upstream')
          text = text.replace(old, new, 1)
          open(path, 'w', encoding='utf-8').write(text)
          print('patched meson.build: +src/jitsi include, -examples')
          PY
          echo "--- meson.build (top) ---"; head -35 meson.build

      - name: Patch cutil-macros for MSVC (probe-time)
        shell: bash
        run: |
          set -e
          # Materialize copies macros before submodule patches; install into the tree
          # that Meson actually compiles against.
          cp patches/msvc/cutil-macros-assert.hpp gstjitsimeet/src/jitsi/macros/assert.hpp
          cp patches/msvc/cutil-macros-coop-assert.hpp gstjitsimeet/src/jitsi/macros/coop-assert.hpp
          echo "installed MSVC cutil-macros patches into src/jitsi/macros/"

      - name: Patch libjitsimeet sources for MSVC (probe-time)
        shell: bash
        run: |
          set -e
          cd gstjitsimeet/src/jitsi
          python - <<'PY'
          def patch(path, old, new, label):
              text = open(path, encoding='utf-8').read()
              if old not in text:
                  raise SystemExit(f'missing {label} in {path}')
              open(path, 'w', encoding='utf-8').write(text.replace(old, new))
              print(f'patched {label} in {path}')

          patch(
              'colibri.cpp',
              '.port      = ws_uri.port,',
              '.port      = static_cast<int>(ws_uri.port),',
              'colibri port cast',
          )
          patch(
              'util/charconv.hpp',
              'std::from_chars(str.begin(), str.end(), r, base)',
              'std::from_chars(str.data(), str.data() + str.size(), r, base)',
              'from_chars string_view iterators',
          )
          patch(
              'jingle/serde/xml/format.hpp',
              '#include "util/charconv.hpp"\n#include "xml/xml.hpp"',
              '#include "../../../util/charconv.hpp"\n#include "../../../xml/xml.hpp"',
              'serde xml format includes (avoid duplicate xml.hpp path on MSVC)',
          )
          patch(
              'jingle/serde/json/format.hpp',
              '#include "json/json.hpp"',
              '#include "../../../json/json.hpp"',
              'serde json format include (avoid duplicate json.hpp path on MSVC)',
          )
          path = 'crypto/base64.cpp'
          text = open(path, encoding='utf-8').read()
          if '#include <array>' not in text:
              text = text.replace('#include <vector>\n', '#include <vector>\n#include <array>\n')
              open(path, 'w', encoding='utf-8').write(text)
              print('patched base64.cpp: +#include <array>')
          else:
              print('base64.cpp already includes <array>')
          path = 'crypto/sha.cpp'
          text = open(path, encoding='utf-8').read()
          text = text.replace(
              '    unwrap(ret, calc_generic<20>(data, "SHA1"));\n    return ret;',
              '    return calc_generic<20>(data, "SHA1");',
          )
          text = text.replace(
              '    unwrap(ret, calc_generic<32>(data, "SHA256"));\n    return ret;',
              '    return calc_generic<32>(data, "SHA256");',
          )
          text = text.replace('ensure(ctx.get() != NULL);', 'if(ctx.get() == NULL) return std::nullopt;')
          text = text.replace('ensure(md != NULL);', 'if(md == NULL) return std::nullopt;')
          text = text.replace(
              'ensure(EVP_DigestInit_ex(ctx.get(), md, NULL) == 1);',
              'if(EVP_DigestInit_ex(ctx.get(), md, NULL) != 1) return std::nullopt;',
          )
          text = text.replace(
              'ensure(EVP_DigestUpdate(ctx.get(), data.data(), data.size()) == 1);',
              'if(EVP_DigestUpdate(ctx.get(), data.data(), data.size()) != 1) return std::nullopt;',
          )
          text = text.replace(
              'ensure(EVP_DigestFinal_ex(ctx.get(), reinterpret_cast<unsigned char*>(buf.data()), NULL) == 1);',
              'if(EVP_DigestFinal_ex(ctx.get(), reinterpret_cast<unsigned char*>(buf.data()), NULL) != 1) return std::nullopt;',
          )
          open(path, 'w', encoding='utf-8').write(text)
          print('patched sha.cpp: drop redundant unwrap + manual nullopt errors')

          MSVC_OPT_MACROS = '''
          // MSVC: `return {}` in trailing-return optional methods is diagnosed as void.
          #undef bail
          #undef ensure
          #undef unwrap
          #undef unwrap_mut
          #define bail(...) do { CUTIL_MACROS_PRINT_FUNC("assertion failed" __VA_OPT__(": ") __VA_ARGS__); return std::nullopt; } while(0)
          #define ensure(cond, ...) do { if(!(cond)) { CUTIL_MACROS_PRINT_FUNC("assertion failed" __VA_OPT__(": ") __VA_ARGS__); return std::nullopt; } } while(0)
          #define unwrap(var, opt, ...) const auto var##_o = (opt); if(!(var##_o)) { return std::nullopt; } const auto& var = *var##_o;
          #define unwrap_mut(var, opt, ...) const auto var##_o = (opt); if(!(var##_o)) { return std::nullopt; } auto& var = *var##_o;

          '''

          def inject_msvc_optional_macros(path: str) -> None:
              text = open(path, encoding='utf-8').read()
              needle = '#include "macros/unwrap.hpp"\n'
              if needle not in text:
                  raise SystemExit(f'missing unwrap include in {path}')
              if 'MSVC: `return {}` in trailing-return optional methods' in text:
                  print(f'skip {path}: MSVC optional macros already injected')
                  return
              open(path, 'w', encoding='utf-8').write(text.replace(needle, needle + MSVC_OPT_MACROS))
              print(f'patched {path}: injected MSVC optional bail macros')

          patch(
              'json/lexer.cpp',
              '    auto expect_string(const std::string_view expect) -> bool {\n'
              '        unwrap(str, reader.read(expect.size()));\n'
              '        return str == expect;',
              '    auto expect_string(const std::string_view expect) -> bool {\n'
              '        const auto str_o = reader.read(expect.size());\n'
              '        if(!str_o) return false;\n'
              '        const auto& str = *str_o;\n'
              '        return str == expect;',
              'lexer expect_string bool bail',
          )
          patch(
              'json/parser.cpp',
              '    auto peek() -> const Token* {\n'
              '        ensure(cursor < tokens.size());\n'
              '        return &tokens[cursor];\n'
              '    }',
              '    auto peek() -> const Token* {\n'
              '        if(!(cursor < tokens.size())) return nullptr;\n'
              '        return &tokens[cursor];\n'
              '    }',
              'json parser peek nullptr bail',
          )
          patch(
              'json/parser.cpp',
              '    template <class T>\n'
              '    auto peek_type() -> const T* {\n'
              '        unwrap(next, peek());\n'
              '        return next.get<T>();\n'
              '    }',
              '    template <class T>\n'
              '    auto peek_type() -> const T* {\n'
              '        const auto next_o = peek();\n'
              '        if(!next_o) return nullptr;\n'
              '        const auto& next = *next_o;\n'
              '        return next.get<T>();\n'
              '    }',
              'json parser peek_type nullptr bail',
          )
          patch(
              'json/parser.cpp',
              '    auto read() -> const Token* {\n'
              '        unwrap(next, peek());\n'
              '        cursor += 1;\n'
              '        return &next;\n'
              '    }',
              '    auto read() -> const Token* {\n'
              '        const auto next_o = peek();\n'
              '        if(!next_o) return nullptr;\n'
              '        const auto& next = *next_o;\n'
              '        cursor += 1;\n'
              '        return &next;\n'
              '    }',
              'json parser read nullptr bail',
          )
          patch(
              'json/parser.cpp',
              '    template <class T>\n'
              '    auto read_type() -> const T* {\n'
              '        unwrap(next, read());\n'
              '        return next.get<T>();\n'
              '    }',
              '    template <class T>\n'
              '    auto read_type() -> const T* {\n'
              '        const auto next_o = read();\n'
              '        if(!next_o) return nullptr;\n'
              '        const auto& next = *next_o;\n'
              '        return next.get<T>();\n'
              '    }',
              'json parser read_type nullptr bail',
          )
          for opt_cpp in ('xml/parser.cpp', 'json/lexer.cpp', 'json/parser.cpp'):
              inject_msvc_optional_macros(opt_cpp)

          WS_NDEBUG_GUARD = '#ifndef NDEBUG\n#define NDEBUG\n#endif\n#undef _DEBUG\n'
          for ws_cpp in ('ws/impl.cpp', 'ws/client.cpp'):
              path = ws_cpp
              text = open(path, encoding='utf-8').read()
              if 'WS_NDEBUG_GUARD' in text:
                  print(f'skip {path}: NDEBUG guard already present')
                  continue
              if '#include <libwebsockets.h>' not in text:
                  raise SystemExit(f'missing libwebsockets include in {path}')
              text = text.replace(
                  '#include <libwebsockets.h>',
                  WS_NDEBUG_GUARD + '#include <libwebsockets.h>',
                  1,
              )
              open(path, 'w', encoding='utf-8').write(text)
              print(f'patched {path}: NDEBUG guard before libwebsockets.h')

          import re
          from pathlib import Path

          def patch_void_bodies(path: Path) -> int:
              text = path.read_text(encoding='utf-8')
              blocks = []
              i = 0
              while True:
                  j = text.find('-> void', i)
                  if j == -1:
                      break
                  k = text.find('{', j)
                  if k == -1:
                      break
                  depth = 0
                  end = k
                  for pos in range(k, len(text)):
                      if text[pos] == '{':
                          depth += 1
                      elif text[pos] == '}':
                          depth -= 1
                          if depth == 0:
                              end = pos + 1
                              break
                  blocks.append((k, end))
                  i = end
              for start, end in reversed(blocks):
                  chunk = text[start:end]
                  chunk = chunk.replace('ensure(', 'ensure_v(').replace('unwrap(', 'unwrap_v(').replace('unwrap_mut(', 'unwrap_v_mut(')
                  text = text[:start] + chunk + text[end:]
              if blocks:
                  path.write_text(text, encoding='utf-8')
              return len(blocks)

          src_root = Path('..')
          total = 0
          for cpp in src_root.rglob('*.cpp'):
              n = patch_void_bodies(cpp)
              if n:
                  print(f'patched {cpp}: {n} void bodies')
                  total += n
          print(f'void-body patch complete: {total} bodies across {src_root}')
          PY

