# PROBE (manual): can UPSTREAM gstjitsimeet + its C++23 submodule tree build with
# MSVC, against an official (MSVC) GStreamer release? This establishes a baseline —
# if upstream builds, MSVC support is real and any breakage is fork-specific; if it
# fails, MSVC support must be added at the source. Throwaway diagnostic, EXPECTED to
# fail initially — read the logs, port what breaks, repeat. Defaults to upstream
# (mojyack); flip the inputs to probe the danryu fork once a baseline exists.
name: TEST - gstjitsimeet on MSVC

on:
  workflow_dispatch:
    inputs:
      gstjitsimeet_repo:
        description: 'gstjitsimeet repo (owner/name)'
        required: false
        default: 'mojyack/gstjitsimeet'
      gstjitsimeet_ref:
        description: 'gstjitsimeet branch/ref (blank = repo default)'
        required: false
        default: ''
      submod_repo:
        description: 'submod repo (owner/name)'
        required: false
        default: 'mojyack/submod'
      coop_repo:
        description: 'coop repo (owner/name)'
        required: false
        default: 'mojyack/coop'

jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Setup MSVC (x64) environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install meson + ninja
        shell: pwsh
        run: pip install meson ninja

      - name: Install pkgconf + GStreamer (official MSVC build)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install -y pkgconfiglite
          # Official GStreamer Windows packages are MSVC x86_64; devel ships headers
          # + lib/pkgconfig. Chocolatey installs to Program Files, not C:\gstreamer.
          choco install -y gstreamer gstreamer-devel
          $gstPc = 'C:\Program Files\gstreamer\1.0\msvc_x86_64\lib\pkgconfig\gstreamer-1.0.pc'
          if (-not (Test-Path $gstPc)) { throw "Missing $gstPc after choco install" }
          Write-Host "Found $gstPc"

      - name: Install openssl via vcpkg (MSVC)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install openssl:x64-windows

      # vcpkg's libwebsockets port does not ship a usable libwebsockets.pc for
      # pkg-config-lite; build from source like gst-build does.
      - name: Build libwebsockets from source (MSVC, pkg-config)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $prefix = "$env:GITHUB_WORKSPACE\lws-install"
          git clone --depth 1 --branch v4.3.6 https://github.com/warmcat/libwebsockets.git lws-src
          cd lws-src
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$prefix" `
            -DLWS_WITH_SHARED=OFF `
            -DLWS_WITH_STATIC=ON `
            -DLWS_WITHOUT_TESTAPPS=ON `
            -DLWS_WITHOUT_TEST_SERVER=ON `
            -DLWS_WITHOUT_TEST_PING=ON `
            -DLWS_WITHOUT_TEST_CLIENT=ON `
            -DLWS_WITH_SSL=ON `
            -DLWS_OPENSSL_SUPPORT=ON `
            -DLWS_WITH_ZLIB=OFF `
            -DLWS_WITHOUT_EXTENSIONS=ON `
            -DLWS_IPV6=ON `
            -DLWS_WITH_LIBUV=OFF `
            -DLWS_WITH_LIBEVENT=OFF `
            -DLWS_WITH_GLIB=OFF `
            -DLWS_WITH_HTTP2=OFF `
            -DLWS_WITH_MINIMAL_EXAMPLES=OFF `
            -DLWS_LINK_TESTAPPS_DYNAMIC=OFF `
            -DOPENSSL_ROOT_DIR="$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows" `
            -DOPENSSL_USE_STATIC_LIBS=TRUE
          cmake --build build --config Release
          cmake --install build
          # libwebsockets only installs .pc files on UNIX/MINGW; write one for MSVC.
          $pcDir = "$prefix\lib\pkgconfig"
          New-Item -ItemType Directory -Force -Path $pcDir | Out-Null
          $prefixPc = ($prefix -replace '\\', '/')
          @"
          prefix=$prefixPc
          exec_prefix=`${prefix}
          libdir=`${exec_prefix}/lib
          includedir=`${prefix}/include
          
          Name: libwebsockets
          Description: Websockets server and client library
          Version: 4.3.6
          Requires: openssl
          Libs: -L`${libdir} -lwebsockets_static
          Cflags: -I`${includedir}
          "@ | ForEach-Object { $_.TrimStart() } | Set-Content -Path "$pcDir\libwebsockets.pc" -Encoding ascii
          Write-Host "Wrote $pcDir\libwebsockets.pc"

      # submod + git operations need bash; symlinks must be real (the submodule tree
      # uses git-tracked symlinks). Cloning needs no toolchain.
      - name: Clone gstjitsimeet + submodule tree
        shell: bash
        run: |
          set -e
          export MSYS=winsymlinks:nativestrict
          git config --global core.symlinks true
          GSTJ_REF='${{ github.event.inputs.gstjitsimeet_ref }}'
          if [ -n "${GSTJ_REF}" ]; then GSTJ_BRANCH=(-b "${GSTJ_REF}"); else GSTJ_BRANCH=(); fi
          git clone -c core.symlinks=true "${GSTJ_BRANCH[@]}" "https://github.com/${{ github.event.inputs.gstjitsimeet_repo }}.git" gstjitsimeet
          cd gstjitsimeet
          # submod populates submodules/ from this repo's own submodules.txt (whatever
          # deps/revs upstream pins). coop is a separate pkg-config dep built below.
          mkdir -p deps && cd deps
          git clone "https://github.com/${{ github.event.inputs.submod_repo }}.git" submod
          git clone "https://github.com/${{ github.event.inputs.coop_repo }}.git" coop
          cd ..
          ./deps/submod/submod clone
          # libjitsimeet keeps nested submodules/ for its in-tree symlinks (ws, xml, …).
          if [ -f submodules/libjitsimeet/submodules.txt ] && [ ! -d submodules/libjitsimeet/submodules/crypto-utils ]; then
            (cd submodules/libjitsimeet && ../../deps/submod/submod clone)
          fi
          # Git for Windows often checks out symlinks as plain text files; ninja needs real links.
          ensure_symlink() {
            local link="$1" target="$2"
            if [ -e "$link/$3" ]; then return 0; fi
            rm -rf "$link"
            ln -s "$target" "$link"
          }
          ensure_symlink src/jitsi ../submodules/libjitsimeet/src async-websocket.cpp
          ensure_symlink src/gstutil ../submodules/gstreamer-utils/src meson.build
          cd submodules/libjitsimeet/src
          for spec in \
            crypto:../submodules/crypto-utils/src:meson.build \
            json:../submodules/tinyjson/src:meson.build \
            macros:../submodules/cutil-macros/src:macros.hpp \
            util:../submodules/cutil/src:meson.build \
            ws:../submodules/websocket-cpp/src:meson.build \
            xml:../submodules/tinyxml/src:meson.build
          do
            IFS=: read -r name tgt marker <<< "$spec"
            ensure_symlink "$name" "$tgt" "$marker"
          done
          cd ../../..
          test -f src/jitsi/async-websocket.cpp
          echo "symlinks OK:"; ls -la src/jitsi/async-websocket.cpp
          echo "Submodule tree:"; ls -la submodules/

      # coop pins cpp_std=c++23 and GCC-only warning flags; MSVC needs c++latest
      # and cl-compatible options (same class of fix as gstjitsimeet below).
      - name: Patch coop meson.build flags for MSVC (probe-time)
        shell: bash
        run: |
          cd gstjitsimeet/deps/coop
          python - <<'PY'
          path = 'meson.build'
          gcc_flags = ["'-Wfatal-errors'", "'-Wno-missing-field-initializers'"]
          out, inserted = [], False
          for ln in open(path, encoding='utf-8').read().splitlines():
              if 'add_project_arguments' in ln and any(f in ln for f in gcc_flags):
                  if not inserted:
                      out += [
                          "cpp_compiler = meson.get_compiler('cpp')",
                          "if cpp_compiler.get_id() == 'msvc'",
                          "  add_project_arguments(['/W3'], language: 'cpp')",
                          "else",
                          "  add_project_arguments('-Wfatal-errors', language: 'cpp')",
                          "  add_project_arguments('-Wno-missing-field-initializers', language: 'cpp')",
                          "endif",
                      ]
                      inserted = True
                  continue
              out.append(ln)
          open(path, 'w', encoding='utf-8').write('\n'.join(out) + '\n')
          print('patched coop meson.build' if inserted else 'NO MATCH — coop meson.build changed upstream')
          PY
          echo "--- coop meson.build (top) ---"; head -15 meson.build

      - name: Build coop (MSVC)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cd gstjitsimeet/deps/coop
          $prefix = "$env:GITHUB_WORKSPACE\gstjitsimeet\deps\coop-install"
          # MSVC meson backend accepts c++latest, not c++23.
          meson setup build --buildtype=release --default-library=static --prefix="$prefix" -Dcpp_std=c++latest
          meson install -C build
          Get-ChildItem "$prefix\lib\pkgconfig"

      # Make the GCC/Clang-only flags compiler-conditional so the probe reaches actual
      # source compilation under MSVC. This transform is what we would upstream into
      # gstjitsimeet/meson.build if the probe succeeds.
      - name: Patch gstjitsimeet meson.build flags for MSVC (probe-time)
        shell: bash
        run: |
          cd gstjitsimeet
          python - <<'PY'
          path = 'meson.build'
          gcc_flags = ['-Wfatal-errors', '-fpermissive', '-Wno-narrowing',
                       '-Wno-missing-field-initializers', '-std=c++23']
          out, inserted = [], False
          for ln in open(path, encoding='utf-8').read().splitlines():
              if 'add_project_arguments' in ln and any(f"'{f}'" in ln for f in gcc_flags):
                  if not inserted:
                      out += [
                          "cpp_compiler = meson.get_compiler('cpp')",
                          "if cpp_compiler.get_id() == 'msvc'",
                          "  add_project_arguments(['/std:c++latest', '/permissive-', '/Zc:preprocessor', '/EHsc', '/bigobj'], language : 'cpp')",
                          "else",
                          "  add_project_arguments(['-Wfatal-errors', '-fpermissive', '-Wno-narrowing', '-Wno-missing-field-initializers', '-std=c++23'], language : 'cpp')",
                          "endif",
                      ]
                      inserted = True
                  continue
              out.append(ln)
          open(path, 'w', encoding='utf-8').write('\n'.join(out) + '\n')
          print('patched' if inserted else 'NO MATCH — meson.build flags changed')
          PY
          echo "--- meson.build (top) ---"; head -25 meson.build

      - name: Configure + build gstjitsimeet (MSVC)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gst   = 'C:\Program Files\gstreamer\1.0\msvc_x86_64\lib\pkgconfig'
          $vcpkg = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\lib\pkgconfig"
          $lws   = "$env:GITHUB_WORKSPACE\lws-install\lib\pkgconfig"
          $coop  = "$env:GITHUB_WORKSPACE\gstjitsimeet\deps\coop-install\lib\pkgconfig"
          $env:PKG_CONFIG_PATH = "$gst;$vcpkg;$lws;$coop"
          Write-Host "PKG_CONFIG_PATH = $env:PKG_CONFIG_PATH"
          foreach ($pkg in @('gstreamer-1.0','gstreamer-rtp-1.0','openssl','libwebsockets','coop')) {
            $ver = pkg-config --modversion $pkg
            if ($LASTEXITCODE -ne 0) { throw "pkg-config failed for $pkg" }
            Write-Host "$pkg = $ver"
          }
          cd gstjitsimeet
          meson setup builddir --buildtype=release -Dcpp_std=c++latest
          meson compile -C builddir