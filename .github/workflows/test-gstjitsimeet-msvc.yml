# Build gstjitsimeet with MSVC on Windows from danryu fork msvc-tidy branches.
# Patches live in fork repos; this workflow only materializes symlinks, builds coop,
# and compiles the plugin. Override inputs to probe upstream or other refs.
name: TEST - gstjitsimeet on MSVC

on:
  workflow_dispatch:
    inputs:
      gstjitsimeet_repo:
        description: 'gstjitsimeet repo (owner/name)'
        required: false
        default: 'danryu/gstjitsimeet'
      gstjitsimeet_ref:
        description: 'gstjitsimeet branch/ref (blank = repo default)'
        required: false
        default: 'msvc-tidy'
      submod_repo:
        description: 'submod repo (owner/name)'
        required: false
        default: 'danryu/submod'
      coop_repo:
        description: 'coop repo (owner/name)'
        required: false
        default: 'danryu/coop'
      coop_ref:
        description: 'coop branch/ref (blank = repo default)'
        required: false
        default: 'msvc-tidy'

jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
    steps:
      - name: Checkout bldrapp (vcpkg cache key)
        uses: actions/checkout@v4

      - name: Setup MSVC (x64) environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # msvc-dev-cmd points VCPKG_ROOT at VS manifest-mode vcpkg (no classic install).
      # GHA's standalone classic vcpkg lives at C:\vcpkg — use that for port installs + cache.
      - name: Pin vcpkg to runner classic instance
        shell: pwsh
        run: |
          "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
          "VCPKG_INSTALLATION_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
          Write-Host "Using classic vcpkg at C:\vcpkg"

      # x-gha needs these two endpoints exposed as env vars to talk to the cache backend.
      - name: Expose GitHub Actions cache to vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install meson + ninja
        shell: pwsh
        run: pip install meson ninja

      - name: Install pkgconf + GStreamer (official MSVC build)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install -y pkgconfiglite
          # Official GStreamer Windows packages are MSVC x86_64; devel ships headers
          # + lib/pkgconfig. Chocolatey installs to Program Files, not C:\gstreamer.
          choco install -y gstreamer gstreamer-devel
          $gstPc = 'C:\Program Files\gstreamer\1.0\msvc_x86_64\lib\pkgconfig\gstreamer-1.0.pc'
          if (-not (Test-Path $gstPc)) { throw "Missing $gstPc after choco install" }
          Write-Host "Found $gstPc"

      # Cache the compiled install tree (~10 min to rebuild openssl + libwebsockets).
      # x-gha (VCPKG_BINARY_SOURCES) is a second layer; this restore skips vcpkg install
      # entirely on a hit. downloads/ speeds up cache misses only.
      - name: Restore vcpkg openssl + libwebsockets cache
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed\x64-windows
          key: vcpkg-msvc-x64-${{ hashFiles('.github/vcpkg-msvc-deps.txt') }}
          restore-keys: |
            vcpkg-msvc-x64-

      - name: Install openssl + libwebsockets via vcpkg (MSVC)
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vcpkgRoot = 'C:\vcpkg'
          Write-Host "Cache miss — building vcpkg ports at $vcpkgRoot (expect ~10 min)"
          & "$vcpkgRoot\vcpkg.exe" install openssl:x64-windows libwebsockets:x64-windows

      - name: Ensure vcpkg pkg-config files (MSVC)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vcpkgRoot = 'C:\vcpkg'
          if ("${{ steps.vcpkg-cache.outputs.cache-hit }}" -eq 'true') {
            Write-Host "vcpkg cache hit — skipped port build"
          } else {
            Write-Host "vcpkg cache miss — ports were built this run"
          }
          $vcpkgPc = "$vcpkgRoot\installed\x64-windows\lib\pkgconfig"
          $lwsPc = "$vcpkgPc\libwebsockets.pc"
          if (-not (Test-Path "$vcpkgRoot\installed\x64-windows\include\openssl\ssl.h")) {
            throw "openssl not present under $vcpkgRoot\installed\x64-windows (cache corrupt?)"
          }
          if (-not (Test-Path "$vcpkgRoot\installed\x64-windows\include\libwebsockets.h")) {
            throw "libwebsockets not present under $vcpkgRoot\installed\x64-windows (cache corrupt?)"
          }
          if (-not (Test-Path $lwsPc)) {
            # Pre-built vcpkg libwebsockets has no .pc on MSVC; point pkg-config at the install tree.
            $prefix = ($vcpkgRoot + '/installed/x64-windows') -replace '\\', '/'
            $cfg = Get-Content "$vcpkgRoot\installed\x64-windows\include\lws_config.h" -Raw
            if ($cfg -match '#define LWS_LIBRARY_VERSION_MAJOR (\d+)') { $maj = $Matches[1] } else { $maj = '4' }
            if ($cfg -match '#define LWS_LIBRARY_VERSION_MINOR (\d+)') { $min = $Matches[1] } else { $min = '3' }
            if ($cfg -match '#define LWS_LIBRARY_VERSION_PATCH (\d+)') { $pat = $Matches[1] } else { $pat = '0' }
            New-Item -ItemType Directory -Force -Path $vcpkgPc | Out-Null
            @"
          prefix=$prefix
          exec_prefix=`${prefix}
          libdir=`${exec_prefix}/lib
          includedir=`${prefix}/include
          
          Name: libwebsockets
          Description: Websockets server and client library
          Version: $maj.$min.$pat
          Requires: openssl
          Libs: -L`${libdir} -lwebsockets
          Cflags: -I`${includedir}
          "@ | ForEach-Object { $_.TrimStart() } | Set-Content -Path $lwsPc -Encoding ascii
            Write-Host "Wrote $lwsPc"
          } else {
            Write-Host "Found $lwsPc"
          }
          $env:PKG_CONFIG_PATH = $vcpkgPc
          foreach ($pkg in @('openssl','libwebsockets')) {
            $ver = pkg-config --modversion $pkg
            if ($LASTEXITCODE -ne 0) { throw "pkg-config failed for $pkg" }
            Write-Host "$pkg = $ver"
          }

      - name: Save vcpkg installed tree to cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\vcpkg\installed\x64-windows
          key: vcpkg-msvc-x64-${{ hashFiles('.github/vcpkg-msvc-deps.txt') }}

      # submod + git operations need bash; symlinks must be real (the submodule tree
      # uses git-tracked symlinks). Cloning needs no toolchain.
      - name: Clone gstjitsimeet + submodule tree
        shell: bash
        run: |
          set -e
          export MSYS=winsymlinks:nativestrict
          git config --global core.symlinks true
          GSTJ_REF='${{ github.event.inputs.gstjitsimeet_ref }}'
          if [ -n "${GSTJ_REF}" ]; then GSTJ_BRANCH=(-b "${GSTJ_REF}"); else GSTJ_BRANCH=(); fi
          git clone -c core.symlinks=true "${GSTJ_BRANCH[@]}" "https://github.com/${{ github.event.inputs.gstjitsimeet_repo }}.git" gstjitsimeet
          cd gstjitsimeet
          # submod populates submodules/ from this repo's own submodules.txt (whatever
          # deps/revs upstream pins). coop is a separate pkg-config dep built below.
          mkdir -p deps && cd deps
          COOP_REF='${{ github.event.inputs.coop_ref }}'
          if [ -n "${COOP_REF}" ]; then COOP_BRANCH=(-b "${COOP_REF}"); else COOP_BRANCH=(); fi
          git clone "https://github.com/${{ github.event.inputs.submod_repo }}.git" submod
          git clone "${COOP_BRANCH[@]}" "https://github.com/${{ github.event.inputs.coop_repo }}.git" coop
          cd ..
          ./deps/submod/submod clone
          # libjitsimeet keeps nested submodules/ for its in-tree symlinks (ws, xml, …).
          if [ -f submodules/libjitsimeet/submodules.txt ] && [ ! -d submodules/libjitsimeet/submodules/crypto-utils ]; then
            (cd submodules/libjitsimeet && ../../deps/submod/submod clone)
          fi
          echo "Submodule tree:"; ls -la submodules/

      # The source tree is stitched together from git-tracked symlinks (src/jitsi,
      # src/gstutil, and libjitsimeet's nested src/crypto|json|macros|util|ws|xml).
      # git-for-windows checks these out BEFORE their submodule targets exist, so it
      # can't tag them as directory links and creates *file-type* symlinks that point
      # at directories. PowerShell/Test-Path can traverse children through such links
      # (so meson configure succeeds), but ninja's Win32 stat cannot -> the depscan
      # step reports "'../src/jitsi/async-websocket.cpp' ... missing". Dereference-copy
      # the whole tree into real directories so every build tool sees plain files.
      # (Targets all exist by now: submod clone ran above.)
      - name: Materialize source tree (deref symlinks into real files)
        shell: bash
        run: |
          set -e
          cd gstjitsimeet
          rm -rf src/jitsi src/gstutil
          cp -RL submodules/libjitsimeet/src src/jitsi
          cp -RL submodules/gstreamer-utils/src src/gstutil
          # Fail loudly here rather than deep in ninja if a link didn't resolve.
          for f in async-websocket.cpp macros/unwrap.hpp crypto/base64.cpp ws/meson.build xml/meson.build json/meson.build; do
            test -f "src/jitsi/$f" || { echo "MISSING after deref-copy: src/jitsi/$f"; exit 1; }
          done
          echo "real source tree OK:"; ls -la src/jitsi | head
          # serde's format.hpp uses upstream include names (json/json.hpp,
          # util/charconv.hpp, xml/xml.hpp). Remove serde's own nested copies of those
          # deps so the includes fall through to the top-level jitsi tree (the patched
          # tinyjson/tinyxml/cutil) via meson's include_directories('src/jitsi').
          rm -rf src/jitsi/jingle/serde/xml/xml src/jitsi/jingle/serde/xml/util
          rm -rf src/jitsi/jingle/serde/json/json
          # ws/ also materializes nested macros/ + util/ copies; Meson adds the source
          # directory to the include path so ws/*.cpp picks those up instead of the
          # patched top-level src/jitsi/{macros,util} tree (MDd/debug-CRT mismatch).
          rm -rf src/jitsi/ws/macros src/jitsi/ws/util
          echo "removed nested serde + ws symlink copies"

      - name: Build coop (MSVC)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cd gstjitsimeet/deps/coop
          $prefix = "$env:GITHUB_WORKSPACE\gstjitsimeet\deps\coop-install"
          # MSVC meson backend accepts c++latest, not c++23.
          meson setup build --buildtype=release --default-library=static --prefix="$prefix" -Dcpp_std=c++latest
          meson install -C build
          Get-ChildItem "$prefix\lib\pkgconfig"

      - name: Configure + build gstjitsimeet (MSVC)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gst   = 'C:\Program Files\gstreamer\1.0\msvc_x86_64\lib\pkgconfig'
          $vcpkg = 'C:\vcpkg\installed\x64-windows\lib\pkgconfig'
          $coop  = "$env:GITHUB_WORKSPACE\gstjitsimeet\deps\coop-install\lib\pkgconfig"
          $env:PKG_CONFIG_PATH = "$gst;$vcpkg;$coop"
          Write-Host "PKG_CONFIG_PATH = $env:PKG_CONFIG_PATH"
          foreach ($pkg in @('gstreamer-1.0','gstreamer-rtp-1.0','openssl','libwebsockets','coop')) {
            $ver = pkg-config --modversion $pkg
            if ($LASTEXITCODE -ne 0) { throw "pkg-config failed for $pkg" }
            Write-Host "$pkg = $ver"
          }
          cd gstjitsimeet
          meson setup builddir --buildtype=release -Dcpp_std=c++latest
          meson compile -C builddir
          if ($LASTEXITCODE -ne 0) {
            $objs = @(
              'builddir/gstjitsimeet.dll.p/src_jitsi_jingle-handler_cert.cpp.obj',
              'builddir/gstjitsimeet.dll.p/src_jitsi_jingle-handler_hostaddr.cpp.obj'
            )
            foreach ($obj in $objs) {
              if (Test-Path $obj) {
                Write-Host "=== dumpbin $obj ($((Get-Item $obj).Length) bytes) ==="
                dumpbin /SYMBOLS $obj | Select-String -Pattern 'cert_|hostname_to_addr|SECT' | Select-Object -First 40
              } else {
                Write-Host "MISSING $obj"
              }
            }
            exit 1
          }