# Source lives in kormix-io/kormix-app under gst-build/. Qt zips from that repo’s releases; GStreamer zips are published there (private) as well.
name: 01 - Build GST static

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: GStreamer static (${{ matrix.artifact_suffix }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    defaults:
      run:
        working-directory: gst-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            arch: arm64
            runner: macos-14
            qt_suffix: macOS-arm64
            artifact_suffix: macOS-arm64
          - platform: macos
            arch: x86_64
            runner: macos-14-large
            qt_suffix: macOS-x86_64
            artifact_suffix: macOS-x86_64
          - platform: windows
            arch: x86_64
            runner: windows-2022
            qt_suffix: Windows
            artifact_suffix: Windows-x86_64

    steps:
      - name: Checkout kormix-app
        uses: actions/checkout@v4
        with:
          repository: kormix-io/kormix-app
          token: ${{ secrets.KORMIX_GH_ACCESS_TOKEN }}
          fetch-depth: 1

      # Cache gst-build/install — keyed on build_gstreamer.sh.
      - name: Restore build cache
        id: cache-gst
        uses: actions/cache@v4
        with:
          path: gst-build/install
          key: gstreamer-install-${{ matrix.artifact_suffix }}-${{ hashFiles('gst-build/build_gstreamer.sh') }}

      - name: Cache status
        shell: bash
        run: |
          if [ "${{ steps.cache-gst.outputs.cache-hit }}" == "true" ]; then
            echo "Cache hit — skipping full build"
          else
            echo "Cache miss — full build required (expect ~2-3 hrs)"
          fi

      # -----------------------------------------------------------------------
      # macOS: install deps, extract Qt, build
      # -----------------------------------------------------------------------

      - name: Select Xcode (macOS)
        if: matrix.platform == 'macos' && steps.cache-gst.outputs.cache-hit != 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Install build dependencies (macOS)
        if: matrix.platform == 'macos' && steps.cache-gst.outputs.cache-hit != 'true'
        run: brew install meson ninja pkg-config python3 bison flex nasm cmake

      - name: Download Qt6 static (macOS)
        if: matrix.platform == 'macos' && steps.cache-gst.outputs.cache-hit != 'true'
        uses: robinraju/release-downloader@v1
        with:
          tag: qt-static-rel5
          repository: kormix-io/kormix-app
          token: ${{ secrets.KORMIX_GH_ACCESS_TOKEN }}
          fileName: qtv6*-static-${{ matrix.qt_suffix }}.zip
          out-file-path: qt-download
          extract: false

      - name: Extract Qt6 static (macOS)
        if: matrix.platform == 'macos' && steps.cache-gst.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ github.workspace }}/qt6-static-build"
          ditto -x -k -v "${{ github.workspace }}/qt-download/qtv6"*.zip "${{ github.workspace }}/qt6-static-build"
          ls -la "${{ github.workspace }}/qt6-static-build"

      - name: Build GStreamer (macOS)
        if: matrix.platform == 'macos' && steps.cache-gst.outputs.cache-hit != 'true'
        env:
          QT_PATH: ${{ github.workspace }}/qt6-static-build/qt6-static-build
          INSTALL_DEPS: "false"
          MACOSX_DEPLOYMENT_TARGET: "13.3"
        run: |
          chmod +x build_gstreamer.sh
          ./build_gstreamer.sh

      # -----------------------------------------------------------------------
      # Windows: native build using MSYS2 UCRT64 (how GStreamer's own CI does it)
      # -----------------------------------------------------------------------

      # Register `msys2` shell + toolchain only when building (not needed for verify/zip on cache hit).
      - name: Setup MSYS2 (Windows)
        if: matrix.platform == 'windows' && steps.cache-gst.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-python
            make
            git
            bison
            flex
            perl
            zip
            unzip

      - name: Download Qt6 static (Windows)
        if: matrix.platform == 'windows' && steps.cache-gst.outputs.cache-hit != 'true'
        uses: robinraju/release-downloader@v1
        with:
          tag: qt-static-rel5
          repository: kormix-io/kormix-app
          token: ${{ secrets.KORMIX_GH_ACCESS_TOKEN }}
          fileName: qtv6*-static-${{ matrix.qt_suffix }}.zip
          out-file-path: qt-download
          extract: false

      - name: Extract Qt6 static (Windows)
        if: matrix.platform == 'windows' && steps.cache-gst.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          mkdir -p "${{ github.workspace }}/qt6-static-build"
          unzip "${{ github.workspace }}/qt-download/qtv6"*.zip -d "${{ github.workspace }}/qt6-static-build"
          ls -la "${{ github.workspace }}/qt6-static-build"

      - name: Build GStreamer (Windows MSYS2 UCRT64)
        if: matrix.platform == 'windows' && steps.cache-gst.outputs.cache-hit != 'true'
        shell: msys2 {0}
        env:
          INSTALL_DEPS: "false"
          MSYS: winsymlinks:nativestrict
        run: |
          export QT_PATH="$(cygpath -u '${{ github.workspace }}/qt6-static-build/qt6-static-build')"
          chmod +x build_gstreamer.sh
          ./build_gstreamer.sh

      # -----------------------------------------------------------------------
      # Verify, package and upload (platform-specific where needed)
      # -----------------------------------------------------------------------

      - name: Verify artifacts (macOS)
        if: matrix.platform == 'macos'
        run: |
          ls -lh install/lib/libgstreamer-full-1.0.a
          find install -name 'libgstqml6*.*'

      # Use pwsh here — `shell: msys2 {0}` only works after msys2/setup-msys2, which we skip on cache hit.
      - name: Verify artifacts (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Get-Item install/lib/libgstreamer-full-1.0.a | Format-List Name, Length
          Get-ChildItem -Recurse install -Filter 'libgstqml6*'

      - name: Archive install directory
        if: matrix.platform != 'windows'
        run: |
          zip -r gstreamer-static-${{ matrix.artifact_suffix }}.zip install/
          ls -lh gstreamer-static-${{ matrix.artifact_suffix }}.zip

      - name: Archive install directory (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $zip = "gstreamer-static-${{ matrix.artifact_suffix }}.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path install -DestinationPath $zip -CompressionLevel Fastest
          Get-Item $zip | Format-List Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gstreamer-static-${{ matrix.artifact_suffix }}
          path: gst-build/gstreamer-static-${{ matrix.artifact_suffix }}.zip
          retention-days: 30

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gstreamer-static-latest
          name: GStreamer Static Build (latest)
          prerelease: true
          make_latest: false
          files: gst-build/gstreamer-static-${{ matrix.artifact_suffix }}.zip
          token: ${{ secrets.KORMIX_GH_ACCESS_TOKEN }}
          repository: kormix-io/kormix-app
