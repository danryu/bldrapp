# Source lives in kormix-io/kormix-app under gst-build/. Qt zips from that repo’s releases; GStreamer zips are published there (private) as well.
name: 01 - Build GST static

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: GStreamer static (${{ matrix.artifact_suffix }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    defaults:
      run:
        working-directory: gst-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            arch: arm64
            runner: macos-14
            qt_suffix: macOS-arm64
            artifact_suffix: macOS-arm64
          - platform: macos
            arch: x86_64
            runner: macos-14-large
            qt_suffix: macOS-x86_64
            artifact_suffix: macOS-x86_64
          - platform: windows
            arch: x86_64
            runner: windows-2022
            qt_suffix: Windows
            artifact_suffix: Windows-x86_64

    steps:
      - name: Checkout kormix-app
        uses: actions/checkout@v4
        with:
          repository: kormix-io/kormix-app
          token: ${{ secrets.KORMIX_GH_ACCESS_TOKEN }}
          fetch-depth: 1

      # Cache gst-build/install — keyed on build_gstreamer.sh.
      # Cache the gstreamer install AND the link-time dep trees the app build needs.
      # On a cache hit the build step is skipped, so every path the archive bundles
      # must be cached too — otherwise the bundle would be incomplete. coop-install
      # lives outside the workspace (cloned alongside via gstjitsimeet), hence the
      # absolute path. openssl-install is macOS/Linux-only (Windows uses system
      # OpenSSL); a non-existent path is simply skipped by actions/cache.
      - name: Restore build cache
        id: cache-gst
        uses: actions/cache@v4
        with:
          path: |
            gst-build/install
            gst-build/openssl-install
            gst-build/libwebsockets-install
            gst-build/x264-install
            ${{ github.workspace }}/../gstjitsimeet/deps/coop-install
          key: gstreamer-bundle-v2-${{ matrix.artifact_suffix }}-${{ hashFiles('gst-build/build_gstreamer.sh') }}

      - name: Cache status
        shell: bash
        run: |
          if [ "${{ steps.cache-gst.outputs.cache-hit }}" == "true" ]; then
            echo "Cache hit — skipping full build"
          else
            echo "Cache miss — full build required (expect ~2-3 hrs)"
          fi

      # -----------------------------------------------------------------------
      # macOS: install deps, extract Qt, build
      # -----------------------------------------------------------------------

      - name: Select Xcode (macOS)
        if: matrix.platform == 'macos' && steps.cache-gst.outputs.cache-hit != 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Install build dependencies (macOS)
        if: matrix.platform == 'macos' && steps.cache-gst.outputs.cache-hit != 'true'
        run: brew install meson ninja pkg-config python3 bison flex nasm cmake

      - name: Download Qt6 static (macOS)
        if: matrix.platform == 'macos' && steps.cache-gst.outputs.cache-hit != 'true'
        uses: robinraju/release-downloader@v1
        with:
          tag: qt-static-rel5
          repository: kormix-io/kormix-app
          token: ${{ secrets.KORMIX_GH_ACCESS_TOKEN }}
          fileName: qtv6*-static-${{ matrix.qt_suffix }}.zip
          out-file-path: qt-download
          extract: false

      - name: Extract Qt6 static (macOS)
        if: matrix.platform == 'macos' && steps.cache-gst.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ github.workspace }}/qt6-static-build"
          ditto -x -k -v "${{ github.workspace }}/qt-download/qtv6"*.zip "${{ github.workspace }}/qt6-static-build"
          ls -la "${{ github.workspace }}/qt6-static-build"

      - name: Build GStreamer (macOS)
        if: matrix.platform == 'macos' && steps.cache-gst.outputs.cache-hit != 'true'
        env:
          QT_PATH: ${{ github.workspace }}/qt6-static-build/qt6-static-build
          INSTALL_DEPS: "false"
          MACOSX_DEPLOYMENT_TARGET: "13.3"
        run: |
          chmod +x build_gstreamer.sh
          ./build_gstreamer.sh

      # -----------------------------------------------------------------------
      # Windows: MSVC build (GStreamer's official Windows toolchain; matches Qt + app).
      # Cerbero-style: the MSVC compiler (cl/nmake) is driven from an MSYS2 shell that
      # provides the unix tooling (make, perl, meson, ninja, cmake, nasm). All deps —
      # openssl, x264, libwebsockets — are source-built with MSVC. `path-type: inherit`
      # makes cl.exe/nmake (added by msvc-dev-cmd) visible inside the MSYS2 shell, and
      # CC=cl/CXX=cl (build step) force meson/cmake onto MSVC despite mingw being present.
      # -----------------------------------------------------------------------

      - name: Setup MSVC (x64) environment (Windows)
        if: matrix.platform == 'windows' && steps.cache-gst.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup MSYS2 (Windows)
        if: matrix.platform == 'windows' && steps.cache-gst.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-python
            make
            git
            bison
            flex
            perl
            zip
            unzip

      - name: Download Qt6 static (Windows)
        if: matrix.platform == 'windows' && steps.cache-gst.outputs.cache-hit != 'true'
        uses: robinraju/release-downloader@v1
        with:
          tag: qt-static-rel5
          repository: kormix-io/kormix-app
          token: ${{ secrets.KORMIX_GH_ACCESS_TOKEN }}
          fileName: qtv6*-static-${{ matrix.qt_suffix }}.zip
          out-file-path: qt-download
          extract: false

      - name: Extract Qt6 static (Windows)
        if: matrix.platform == 'windows' && steps.cache-gst.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/qt6-static-build" | Out-Null
          $zip = Get-ChildItem "${{ github.workspace }}/qt-download/qtv6*.zip" | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath "${{ github.workspace }}/qt6-static-build" -Force
          Get-ChildItem "${{ github.workspace }}/qt6-static-build"

      - name: Build GStreamer (Windows MSVC)
        if: matrix.platform == 'windows' && steps.cache-gst.outputs.cache-hit != 'true'
        shell: msys2 {0}
        env:
          INSTALL_DEPS: "false"
          MSYS: winsymlinks:nativestrict
          # Force MSVC for meson/cmake even though mingw gcc is present in UCRT64.
          CC: cl
          CXX: cl
        run: |
          # meson/MSVC: MSYS2's /usr/bin/link.exe (GNU coreutils 'link') shadows MSVC's
          # linker on PATH and meson probes PATH by name. Remove the coreutils link so
          # the MSVC link.exe is found. (coreutils 'link' is unused by this build.)
          rm -f /usr/bin/link.exe /usr/bin/link
          export QT_PATH="$(cygpath -u '${{ github.workspace }}/qt6-static-build/qt6-static-build')"
          git config --global core.symlinks true
          chmod +x build_gstreamer.sh
          ./build_gstreamer.sh

      # -----------------------------------------------------------------------
      # Verify, package and upload (platform-specific where needed)
      # -----------------------------------------------------------------------

      - name: Verify artifacts (macOS)
        if: matrix.platform == 'macos'
        run: |
          ls -lh install/lib/libgstreamer-full-1.0.a
          find install -name 'libgstqml6*.*'

      # Use pwsh here — `shell: msys2 {0}` only works after msys2/setup-msys2, which we skip on cache hit.
      - name: Verify artifacts (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          # MSVC: gstreamer-full-1.0.lib / gstqml6.lib (no 'lib' prefix, .lib ext).
          $full = Get-ChildItem -Recurse install -Include 'gstreamer-full-1.0.lib','libgstreamer-full-1.0.*'
          if (-not $full) { Write-Error "gstreamer-full static lib not found under install/"; exit 1 }
          $full | Format-List FullName, Length
          Get-ChildItem -Recurse install -Include 'gstqml6.*','libgstqml6.*' | Format-List FullName

      # Bundle the gstreamer install plus the link-time dependency trees the app
      # build resolves via pkg-config (gstreamer-full-1.0.pc Requires openssl, coop,
      # libwebsockets, ...). The zip stores them as sibling top-level dirs; build-app
      # restores them to the same absolute paths so the .pc prefixes stay valid.
      - name: Archive install directory
        if: matrix.platform != 'windows'
        run: |
          set -e
          STAGE="${RUNNER_TEMP}/gst-bundle"
          rm -rf "${STAGE}"; mkdir -p "${STAGE}"
          # Required everywhere
          for d in install libwebsockets-install x264-install; do
            if [ ! -d "${d}" ]; then echo "ERROR: expected gst-build/${d} missing"; exit 1; fi
            cp -a "${d}" "${STAGE}/${d}"
          done
          # macOS/Linux build OpenSSL from source (Windows uses system OpenSSL)
          if [ -d openssl-install ]; then cp -a openssl-install "${STAGE}/openssl-install"; fi
          # coop-install is built under the sibling gstjitsimeet checkout
          COOP="../../gstjitsimeet/deps/coop-install"
          if [ ! -d "${COOP}" ]; then echo "ERROR: expected ${COOP} missing"; exit 1; fi
          cp -a "${COOP}" "${STAGE}/coop-install"
          ( cd "${STAGE}" && zip -ry "${GITHUB_WORKSPACE}/gst-build/gstreamer-static-${{ matrix.artifact_suffix }}.zip" . )
          ls -lh gstreamer-static-${{ matrix.artifact_suffix }}.zip
          echo "Bundled dirs:"; ( cd "${STAGE}" && ls -d */ )

      - name: Archive install directory (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'gst-bundle'
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          # All deps are source-built with MSVC into gst-build/*-install (same as macOS).
          foreach ($d in @('install','openssl-install','libwebsockets-install','x264-install')) {
            if (-not (Test-Path $d)) { Write-Error "expected gst-build/$d missing"; exit 1 }
            Copy-Item -Recurse -Force $d (Join-Path $stage $d)
          }
          $coop = '../../gstjitsimeet/deps/coop-install'
          if (-not (Test-Path $coop)) { Write-Error "expected $coop missing"; exit 1 }
          Copy-Item -Recurse -Force $coop (Join-Path $stage 'coop-install')
          $zip = "gstreamer-static-${{ matrix.artifact_suffix }}.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Fastest
          Get-Item $zip | Format-List Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gstreamer-static-${{ matrix.artifact_suffix }}
          path: gst-build/gstreamer-static-${{ matrix.artifact_suffix }}.zip
          retention-days: 30

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gstreamer-static-latest
          name: GStreamer Static Build (latest)
          prerelease: true
          make_latest: false
          files: gst-build/gstreamer-static-${{ matrix.artifact_suffix }}.zip
          token: ${{ secrets.KORMIX_GH_ACCESS_TOKEN }}
          repository: kormix-io/kormix-app
