# Builds static Qt from sources checked out from kormix-io/kormix-app (CMake cache keys).
# Publishes zip artifacts to a GitHub Release on the private repo kormix-io/kormix-app.
name: 00 - Build Qt Static

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    defaults:
      run:
        working-directory: kormix-app
    strategy:
      fail-fast: false # Keep running other jobs even if one fails
      matrix:
        include:
          # Qt 6.8 LTS line: use latest v6.8.x tag from code.qt.io/qt/qt5 (public mirror).
          - name: macOS-arm64
            os: macos-14
            qt_platform: macx-clang
            qt_configure_args: "-feature-appstore-compliant -DCMAKE_OSX_ARCHITECTURES=\"arm64\""
            cmake_generator: "Xcode"
            qt_version: "v6.8.3"
            # Pin to a release tag Qt Multimedia documents; bump when Qt’s bundled FFmpeg version changes.
            ffmpeg_branch: "n6.1.2"
            packages: "" # Most deps handled by Xcode

          # --- Temporarily disabled: only macOS arm64 builds for now ---
          # Intel runner: host tools (moc, qmake, …) must be x86_64.
          # - name: macOS-x86_64
          #   os: macos-14-large
          #   qt_platform: macx-clang
          #   qt_configure_args: "-feature-appstore-compliant -DCMAKE_OSX_ARCHITECTURES=\"x86_64\""
          #   cmake_generator: "Xcode"
          #   qt_version: "v6.8.3"
          #   ffmpeg_branch: "n6.1.2"
          #   packages: "" # Most deps handled by Xcode
          #
          # - name: Windows
          #   os: windows-2022
          #   qt_platform: win32-g++
          #   qt_configure_args: ""
          #   cmake_generator: "Ninja"
          #   qt_version: "v6.8.3"
          #   ffmpeg_branch: "n6.1.2"
          #   packages: "" # Installed via MSYS2 pacman

    name: Qt6 static (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout kormix-app
      uses: actions/checkout@v4
      with:
        repository: kormix-io/kormix-app
        path: kormix-app
        token: ${{ secrets.KORMIX_GH_ACCESS_TOKEN }}
        submodules: recursive

    - name: Set up Ccache (macOS)
      if: runner.os == 'macOS'
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: qt-build-${{ matrix.name }}
        max-size: 1G

    - name: Install macOS dependencies (Xcode)
      if: runner.os == 'macOS'
      run: |
        echo "Xcode / CLT are provided on GitHub-hosted runners."
        # FFmpeg build deps (Qt doc: https://doc.qt.io/qt-6/qtmultimedia-building-ffmpeg-macos.html )
        brew update
        brew install yasm

    - name: Set up MSYS2 MINGW64 (Windows)
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-python
          mingw-w64-x86_64-perl
          mingw-w64-x86_64-yasm
          mingw-w64-x86_64-nasm
          mingw-w64-x86_64-diffutils
          git
          make


    # --- Qt Static Build ---
    - name: Cache Qt Build
      id: cache-qt
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/kormix-app/qt6-static-build
        key: ${{ runner.os }}-qt6-static-${{ matrix.name }}-${{ matrix.ffmpeg_branch }}-${{ hashFiles('kormix-app/CMakeLists.txt', 'kormix-app/src/**/CMakeLists.txt') }}-${{ hashFiles('.github/workflows/build-qt-static.yml') }}

    - name: Build Qt Statically (macOS)
      if: steps.cache-qt.outputs.cache-hit != 'true' && runner.os == 'macOS'
      shell: bash
      run: |
        QT_VERSION_BRANCH=${{ matrix.qt_version }} # Use platform-specific Qt version
        # --- Define paths relative to workspace root ---
        QT_SOURCE_REL=qt-source
        QT_BUILD_REL=qt-build
        QT_INSTALL_REL=qt6-static-build
        # Absolute path still needed for cache/artifact steps later
        QT_INSTALL_ABS=${{ github.workspace }}/kormix-app/$QT_INSTALL_REL

        MODULE_SUBSET="qtbase,qtdeclarative,qtsvg,qtwebsockets,qtmultimedia,qtwebchannel,qtshadertools" # Define the module subset

        echo "Cloning Qt top-level repository ($QT_VERSION_BRANCH) to relative path: $QT_SOURCE_REL ..."
        # Clone to relative path
        git clone --branch $QT_VERSION_BRANCH --depth 1 --single-branch https://code.qt.io/qt/qt5.git "$QT_SOURCE_REL" || exit 1

        echo "Changing to source directory: $QT_SOURCE_REL"
        cd "$QT_SOURCE_REL" || exit 1 # cd into relative path

        echo "Initializing submodule configurations ($MODULE_SUBSET)..."
        ./init-repository --module-subset=$MODULE_SUBSET || exit 1

        echo "Fetching required submodules (subset only)..."
        # Don't use --init (re-inits ALL modules) or --depth 1 (fails on non-tip commits)
        git submodule update --recursive --recommend-shallow || exit 1

        echo "Changing back to workspace root..."
        cd .. || exit 1 # Go up one level from source dir

        WS_ROOT=$(pwd) 
        echo "Workspace root is now: $WS_ROOT" # github.workspace/kormix-app when using defaults.

        # --- Static FFmpeg (required for fully static Qt Multimedia; Homebrew is shared-only) ---
        # Qt docs: https://doc.qt.io/qt-6/qtmultimedia-building-ffmpeg-macos.html
        FFMPEG_BRANCH="${{ matrix.ffmpeg_branch }}"
        FFMPEG_SRC_REL=ffmpeg-source
        FFMPEG_BUILD_REL=ffmpeg-build
        FFMPEG_INSTALL_ABS="${WS_ROOT}/ffmpeg-install"
        echo "Building static FFmpeg (${FFMPEG_BRANCH}) -> ${FFMPEG_INSTALL_ABS}"
        rm -rf "${FFMPEG_SRC_REL}" "${FFMPEG_BUILD_REL}" "${FFMPEG_INSTALL_ABS}"
        git clone --branch "${FFMPEG_BRANCH}" --depth 1 https://git.ffmpeg.org/ffmpeg.git "${FFMPEG_SRC_REL}" || exit 1
        mkdir -p "${FFMPEG_BUILD_REL}" || exit 1
        cd "${FFMPEG_BUILD_REL}" || exit 1
        # Static libs: Qt doc says omit --enable-shared (contrast with shared example).
        "../${FFMPEG_SRC_REL}/configure" \
          --prefix="${FFMPEG_INSTALL_ABS}" \
          --disable-doc \
          --enable-network \
          --enable-static \
          --enable-pic \
          --disable-programs \
          --pkg-config-flags="--static" \
          || exit 1
        make -j"$(sysctl -n hw.ncpu 2>/dev/null || echo 4)" install || exit 1
        cd "${WS_ROOT}" || exit 1
        if [[ ! -f "${FFMPEG_INSTALL_ABS}/lib/pkgconfig/libavcodec.pc" ]]; then
          echo "FFmpeg libavcodec.pc missing under ${FFMPEG_INSTALL_ABS}"
          ls -la "${FFMPEG_INSTALL_ABS}/lib" || true
          exit 1
        fi

        echo "Creating build directory (relative): $QT_BUILD_REL"
        mkdir -p "$QT_BUILD_REL" || exit 1 # mkdir relative path

        echo "Changing to build directory (relative): $QT_BUILD_REL"
        cd "$QT_BUILD_REL" || exit 1 # cd into relative path

        echo "Listing available configure features..."
        # Use relative path to configure script
        ../"$QT_SOURCE_REL"/configure -list-features

        echo "Listing available configure options..."
        # Use relative path to configure script
        ../"$QT_SOURCE_REL"/configure -help

        echo "Configuring Qt from build directory..."
        echo "Using static FFmpeg prefix for Qt Multimedia: ${FFMPEG_INSTALL_ABS}"

        # Base configure command (-ffmpeg-deploy omitted: no shared FFmpeg libs to copy)
        CONFIGURE_CMD=(../"$QT_SOURCE_REL"/configure -prefix "../$QT_INSTALL_REL" \
          -release \
          -static \
          -opensource -confirm-license \
          -no-pch \
          -nomake examples -nomake tests \
          -ffmpeg-dir "${FFMPEG_INSTALL_ABS}" \
          -skip qtwebengine \
          -skip qtmqtt \
          -skip qtnetworkauth \
          -skip qtopcua \
          -skip qt3d \
          -skip qt5compat \
          -skip qtactiveqt \
          -skip qtdoc \
          -skip qtcharts \
          -skip qtcoap \
          -skip qtconnectivity \
          -skip qtdatavis3d \
          -skip qtgraphs \
          -skip qtgrpc \
          -skip qthttpserver \
          -skip qtimageformats \
          -skip qtlanguageserver \
          -skip qtlocation \
          -skip qtlottie \
          -skip qtpositioning \
          -skip qtquick3d \
          -skip qtquick3dphysics \
          -skip qtquickeffectmaker \
          -skip qtquicktimeline \
          -skip qtremoteobjects \
          -skip qtscxml \
          -skip qtsensors \
          -skip qtserialbus \
          -skip qtserialport \
          -skip qtspeech \
          -skip qttranslations \
          -skip qtvirtualkeyboard \
          -qt-zlib \
          -qt-libpng \
          -qt-libjpeg \
          -qt-freetype \
          -qt-harfbuzz \
          -qt-pcre \
          ${{ matrix.qt_configure_args }} \
          -platform ${{ matrix.qt_platform }} )

        # Removed to allow qttools and hopefully lrelease to be built (needed for GStreamer build and qt detection)
        # -skip qttools \

        # SSL backend (macOS only in this job)
        CONFIGURE_CMD+=(-securetransport)

        # Execute configure
        echo "Running Configure: ${CONFIGURE_CMD[@]}"
        "${CONFIGURE_CMD[@]}" || (cat config.log && exit 1) # Show log on failure

        echo "----- config.summary (FFmpeg / Multimedia plugin check) -----"
        if [[ -f config.summary ]]; then
          grep -E -i 'ffmpeg|multimedia|plugin' config.summary || true
        fi
        echo "--------------------------------------------------------------"

        echo "Building Qt modules..."
        if command -v ccache &> /dev/null; then
          export CXX="ccache clang++" CC="ccache clang"
          ccache -z
        fi

        # Build with parallel jobs (already in build directory)
        cmake --build . --parallel $(sysctl -n hw.ncpu 2>/dev/null || echo 4) || exit 1

        echo "Installing Qt..."
        # Install to the relative prefix path (already in build directory)
        cmake --install . || exit 1

        if command -v ccache &> /dev/null; then
          ccache -s # Show stats
        fi

    - name: Build Qt Statically (Windows/MinGW)
      if: steps.cache-qt.outputs.cache-hit != 'true' && runner.os == 'Windows'
      shell: msys2 {0}
      run: |
        QT_VERSION_BRANCH=${{ matrix.qt_version }}
        QT_SOURCE_REL=qt-source
        QT_BUILD_REL=qt-build
        QT_INSTALL_REL=qt6-static-build
        QT_INSTALL_ABS=${{ github.workspace }}/kormix-app/$QT_INSTALL_REL

        MODULE_SUBSET="qtbase,qtdeclarative,qtsvg,qtwebsockets,qtmultimedia,qtwebchannel,qtshadertools"

        echo "Cloning Qt top-level repository ($QT_VERSION_BRANCH)..."
        git clone --branch $QT_VERSION_BRANCH --depth 1 --single-branch https://code.qt.io/qt/qt5.git "$QT_SOURCE_REL" || exit 1

        cd "$QT_SOURCE_REL" || exit 1
        echo "Initializing submodule configurations ($MODULE_SUBSET)..."
        ./init-repository --module-subset=$MODULE_SUBSET || exit 1
        echo "Fetching required submodules (subset only)..."
        # Don't use --init (re-inits ALL modules) or --depth 1 (fails on non-tip commits)
        git submodule update --recursive --recommend-shallow || exit 1
        cd .. || exit 1

        WS_ROOT=$(pwd)

        # --- Static FFmpeg (MinGW): https://doc.qt.io/qt-6/qtmultimedia-building-ffmpeg-windows.html
        FFMPEG_BRANCH="${{ matrix.ffmpeg_branch }}"
        FFMPEG_SRC_REL=ffmpeg-source
        FFMPEG_BUILD_REL=ffmpeg-build
        FFMPEG_INSTALL_ABS="${WS_ROOT}/ffmpeg-install"
        echo "Building static FFmpeg (${FFMPEG_BRANCH}) -> ${FFMPEG_INSTALL_ABS}"
        rm -rf "${FFMPEG_SRC_REL}" "${FFMPEG_BUILD_REL}" "${FFMPEG_INSTALL_ABS}"
        git clone --branch "${FFMPEG_BRANCH}" --depth 1 https://git.ffmpeg.org/ffmpeg.git "${FFMPEG_SRC_REL}" || exit 1
        mkdir -p "${FFMPEG_BUILD_REL}" || exit 1
        cd "${FFMPEG_BUILD_REL}" || exit 1
        # Static libs: Qt doc says omit --enable-shared (contrast with shared example).
        "../${FFMPEG_SRC_REL}/configure" \
          --prefix="${FFMPEG_INSTALL_ABS}" \
          --disable-doc \
          --enable-network \
          --enable-static \
          --enable-pic \
          --disable-programs \
          --pkg-config-flags="--static" \
          --target-os=mingw32 \
          || exit 1
        make -j"${NUMBER_OF_PROCESSORS:-4}" install || exit 1
        cd "${WS_ROOT}" || exit 1

        mkdir -p "$QT_BUILD_REL" || exit 1
        cd "$QT_BUILD_REL" || exit 1

        echo "Configuring Qt with MinGW-w64..."
        echo "Using static FFmpeg prefix: ${FFMPEG_INSTALL_ABS}"
        CONFIGURE_CMD=(../"$QT_SOURCE_REL"/configure -prefix "../$QT_INSTALL_REL" \
          -release \
          -static \
          -opensource -confirm-license \
          -no-pch \
          -nomake examples -nomake tests \
          -ffmpeg-dir "${FFMPEG_INSTALL_ABS}" \
          -skip qtwebengine \
          -skip qtmqtt \
          -skip qtnetworkauth \
          -skip qtopcua \
          -skip qt3d \
          -skip qt5compat \
          -skip qtactiveqt \
          -skip qtdoc \
          -skip qtcharts \
          -skip qtcoap \
          -skip qtconnectivity \
          -skip qtdatavis3d \
          -skip qtgraphs \
          -skip qtgrpc \
          -skip qthttpserver \
          -skip qtimageformats \
          -skip qtlanguageserver \
          -skip qtlocation \
          -skip qtlottie \
          -skip qtpositioning \
          -skip qtquick3d \
          -skip qtquick3dphysics \
          -skip qtquickeffectmaker \
          -skip qtquicktimeline \
          -skip qtremoteobjects \
          -skip qtscxml \
          -skip qtsensors \
          -skip qtserialbus \
          -skip qtserialport \
          -skip qtspeech \
          -skip qttranslations \
          -skip qtvirtualkeyboard \
          -qt-zlib \
          -qt-libpng \
          -qt-libjpeg \
          -qt-freetype \
          -qt-harfbuzz \
          -qt-pcre \
          ${{ matrix.qt_configure_args }} \
          -platform ${{ matrix.qt_platform }} \
          -schannel)

        echo "Running Configure: ${CONFIGURE_CMD[@]}"
        "${CONFIGURE_CMD[@]}" || (cat config.log && exit 1)

        echo "----- config.summary (FFmpeg / Multimedia plugin check) -----"
        if [[ -f config.summary ]]; then
          grep -E -i 'ffmpeg|multimedia|plugin' config.summary || true
        fi
        echo "--------------------------------------------------------------"

        echo "Building Qt modules..."
        cmake --build . --parallel ${NUMBER_OF_PROCESSORS:-4} || exit 1

        echo "Installing Qt..."
        cmake --install . || exit 1

    # --- Package and Upload Qt Build ---
    - name: Package Qt Build
      shell: bash
      run: |
        ARTIFACT_NAME="qt${{ matrix.qt_version }}-static-${{ matrix.name }}.zip"
        echo "Creating archive: $ARTIFACT_NAME from qt6-static-build/"
        cd "${{ github.workspace }}/kormix-app"
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          7z a "${{ github.workspace }}/$ARTIFACT_NAME" -r qt6-static-build/* || exit 1
        else
          zip -r "${{ github.workspace }}/$ARTIFACT_NAME" qt6-static-build || exit 1
        fi

    - name: Upload Qt Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: qt${{ matrix.qt_version }}-static-${{ matrix.name }}
        path: ${{ github.workspace }}/qt${{ matrix.qt_version }}-static-${{ matrix.name }}.zip


  create-release:
    name: Create Qt Release
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: qt*-static-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          repository: kormix-io/kormix-app
          files: artifacts/*
          tag_name: qt-static-rel5
          name: Qt 6.8.x static (macOS arm64)
          body: |
            Static Qt 6.8.x builds (LTS line, v6.8.3 from code.qt.io mirror).

            **FFmpeg** is built **from source as static libraries** (see Qt Multimedia docs), then
            Qt is configured with `-ffmpeg-dir` pointing at that prefix — not Homebrew/shared FFmpeg.

            Matrix key `ffmpeg_branch` pins the release tag (e.g. `n6.1.2`); align with Qt’s
            documented FFmpeg version when upgrading Qt.

            Currently published:
            - macOS Apple Silicon (arm64) — macos-14
        env:
          GITHUB_TOKEN: ${{ secrets.KORMIX_GH_ACCESS_TOKEN }}