# Builds static Qt from sources checked out from kormix-io/kormix-app (CMake cache keys).
# Publishes zip artifacts to a GitHub Release on the private repo kormix-io/kormix-app.
name: 00 - Build Qt Static

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    defaults:
      run:
        working-directory: kormix-app
    strategy:
      fail-fast: false # Keep running other jobs even if one fails
      matrix:
        include:
          - name: macOS-arm64
            os: macos-14
            qt_platform: macx-clang
            qt_configure_args: "-feature-appstore-compliant -DCMAKE_OSX_ARCHITECTURES=\"arm64\""
            cmake_generator: "Xcode"
            qt_version: "v6.5.8-lts-lgpl"
            packages: "" # Most deps handled by Xcode

          # Intel runner: host tools (moc, qmake, …) must be x86_64.
          - name: macOS-x86_64
            os: macos-14-large
            qt_platform: macx-clang
            qt_configure_args: "-feature-appstore-compliant -DCMAKE_OSX_ARCHITECTURES=\"x86_64\""
            cmake_generator: "Xcode"
            qt_version: "v6.5.8-lts-lgpl"
            packages: "" # Most deps handled by Xcode

          - name: Windows
            os: windows-2022
            qt_platform: win32-msvc
            qt_configure_args: ""
            cmake_generator: "Ninja"
            qt_version: "v6.5.8-lts-lgpl"
            packages: ""

    name: Qt6 static (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout kormix-app
      uses: actions/checkout@v4
      with:
        repository: kormix-io/kormix-app
        path: kormix-app
        token: ${{ secrets.KORMIX_GH_ACCESS_TOKEN }}
        submodules: recursive

    - name: Set up Ccache (macOS)
      if: runner.os == 'macOS'
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: qt-build-${{ matrix.name }}
        max-size: 1G

    - name: Install macOS dependencies (Xcode)
      if: runner.os == 'macOS'
      run: |
        # Xcode Command Line Tools are usually pre-installed on GitHub runners
        echo "Xcode should be available."
        # If specific packages needed via brew, install here:
        # brew install ninja ccache # Example if needed

    # MSVC (not MinGW) so static Qt matches the MSVC GStreamer and app builds — the
    # whole Windows chain is MSVC because JUCE/ASIO is MSVC-only and GStreamer's
    # official Windows builds are MSVC.
    - name: Set up MSVC (x64) environment (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Set up Python (Windows)
      if: runner.os == 'Windows'
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Ninja (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: choco install -y ninja
      # Perl (Strawberry) is preinstalled on windows-2022; Qt configure needs perl+python.


    # --- Qt Static Build ---
    - name: Cache Qt Build
      id: cache-qt
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/kormix-app/qt6-static-build
        key: ${{ runner.os }}-qt6-static-${{ matrix.name }}-${{ hashFiles('kormix-app/CMakeLists.txt', 'kormix-app/src/**/CMakeLists.txt') }}-${{ hashFiles('.github/workflows/build-qt-static.yml') }}

    - name: Build Qt Statically (macOS)
      if: steps.cache-qt.outputs.cache-hit != 'true' && runner.os == 'macOS'
      shell: bash
      run: |
        QT_VERSION_BRANCH=${{ matrix.qt_version }} # Use platform-specific Qt version
        # --- Define paths relative to workspace root ---
        QT_SOURCE_REL=qt-source
        QT_BUILD_REL=qt-build
        QT_INSTALL_REL=qt6-static-build
        # Absolute path still needed for cache/artifact steps later
        QT_INSTALL_ABS=${{ github.workspace }}/kormix-app/$QT_INSTALL_REL

        MODULE_SUBSET="qtbase,qtdeclarative,qtsvg,qtwebsockets,qtmultimedia,qtwebchannel,qtshadertools" # Define the module subset

        echo "Cloning Qt top-level repository ($QT_VERSION_BRANCH) to relative path: $QT_SOURCE_REL ..."
        # Clone to relative path
        git clone --branch $QT_VERSION_BRANCH --depth 1 --single-branch https://code.qt.io/qt/qt5.git "$QT_SOURCE_REL" || exit 1

        echo "Changing to source directory: $QT_SOURCE_REL"
        cd "$QT_SOURCE_REL" || exit 1 # cd into relative path

        echo "Initializing submodule configurations ($MODULE_SUBSET)..."
        ./init-repository --module-subset=$MODULE_SUBSET || exit 1

        echo "Fetching required submodules (subset only)..."
        # Don't use --init (re-inits ALL modules) or --depth 1 (fails on non-tip commits)
        git submodule update --recursive --recommend-shallow || exit 1

        echo "Changing back to workspace root..."
        cd .. || exit 1 # Go up one level from source dir

        WS_ROOT=$(pwd) 
        echo "Workspace root is now: $WS_ROOT" # Should be github.workspace

        echo "Creating build directory (relative): $QT_BUILD_REL"
        mkdir -p "$QT_BUILD_REL" || exit 1 # mkdir relative path

        echo "Changing to build directory (relative): $QT_BUILD_REL"
        cd "$QT_BUILD_REL" || exit 1 # cd into relative path

        echo "Listing available configure features..."
        # Use relative path to configure script
        ../"$QT_SOURCE_REL"/configure -list-features

        echo "Listing available configure options..."
        # Use relative path to configure script
        ../"$QT_SOURCE_REL"/configure -help

        echo "Configuring Qt from build directory..."

        # Base configure command
        CONFIGURE_CMD=(../"$QT_SOURCE_REL"/configure -prefix "../$QT_INSTALL_REL" \
          -release \
          -static \
          -opensource -confirm-license \
          -no-pch \
          -nomake examples -nomake tests \
          -skip qtwebengine \
          -skip qtmqtt \
          -skip qtnetworkauth \
          -skip qtopcua \
          -skip qt3d \
          -skip qt5compat \
          -skip qtactiveqt \
          -skip qtdoc \
          -skip qtcharts \
          -skip qtcoap \
          -skip qtconnectivity \
          -skip qtdatavis3d \
          -skip qtgraphs \
          -skip qtgrpc \
          -skip qthttpserver \
          -skip qtimageformats \
          -skip qtlanguageserver \
          -skip qtlocation \
          -skip qtlottie \
          -skip qtpositioning \
          -skip qtquick3d \
          -skip qtquick3dphysics \
          -skip qtquickeffectmaker \
          -skip qtquicktimeline \
          -skip qtremoteobjects \
          -skip qtscxml \
          -skip qtsensors \
          -skip qtserialbus \
          -skip qtserialport \
          -skip qtspeech \
          -skip qttranslations \
          -skip qtvirtualkeyboard \
          -qt-zlib \
          -qt-libpng \
          -qt-libjpeg \
          -qt-freetype \
          -qt-harfbuzz \
          -qt-pcre \
          ${{ matrix.qt_configure_args }} \
          -platform ${{ matrix.qt_platform }} )

        # Removed to allow qttools and hopefully lrelease to be built (needed for GStreamer build and qt detection)
        # -skip qttools \

        # SSL backend (macOS only in this job)
        CONFIGURE_CMD+=(-securetransport)

        # Execute configure
        echo "Running Configure: ${CONFIGURE_CMD[@]}"
        "${CONFIGURE_CMD[@]}" || (cat config.log && exit 1) # Show log on failure

        echo "Building Qt modules..."
        if command -v ccache &> /dev/null; then
          export CXX="ccache clang++" CC="ccache clang"
          ccache -z
        fi

        # Build with parallel jobs (already in build directory)
        cmake --build . --parallel $(sysctl -n hw.ncpu 2>/dev/null || echo 4) || exit 1

        echo "Installing Qt..."
        # Install to the relative prefix path (already in build directory)
        cmake --install . || exit 1

        if command -v ccache &> /dev/null; then
          ccache -s # Show stats
        fi

    - name: Build Qt Statically (Windows/MSVC)
      if: steps.cache-qt.outputs.cache-hit != 'true' && runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $QT_VERSION_BRANCH = "${{ matrix.qt_version }}"
        $QT_SOURCE_REL  = "qt-source"
        $QT_BUILD_REL   = "qt-build"
        $QT_INSTALL_REL = "qt6-static-build"
        $MODULE_SUBSET  = "qtbase,qtdeclarative,qtsvg,qtwebsockets,qtmultimedia,qtwebchannel,qtshadertools"

        Write-Host "Cloning Qt top-level repository ($QT_VERSION_BRANCH)..."
        git clone --branch $QT_VERSION_BRANCH --depth 1 --single-branch https://code.qt.io/qt/qt5.git $QT_SOURCE_REL
        if ($LASTEXITCODE -ne 0) { throw "git clone failed" }

        Push-Location $QT_SOURCE_REL
        Write-Host "Initializing submodule configurations ($MODULE_SUBSET)..."
        perl init-repository --module-subset=$MODULE_SUBSET
        if ($LASTEXITCODE -ne 0) { throw "init-repository failed" }
        # Don't use --init (re-inits ALL modules) or --depth 1 (fails on non-tip commits)
        git submodule update --recursive --recommend-shallow
        if ($LASTEXITCODE -ne 0) { throw "submodule update failed" }
        Pop-Location

        New-Item -ItemType Directory -Force -Path $QT_BUILD_REL | Out-Null
        Push-Location $QT_BUILD_REL

        # win32-msvc + cl.exe (from msvc-dev-cmd). configure.bat picks the Ninja
        # generator since ninja is on PATH. Bundled blake2 (no system libb2).
        $cfg = @(
          "-prefix", "../$QT_INSTALL_REL",
          "-release", "-static",
          "-opensource", "-confirm-license",
          "-no-pch",
          "-nomake", "examples", "-nomake", "tests",
          "-skip","qtwebengine","-skip","qtmqtt","-skip","qtnetworkauth","-skip","qtopcua",
          "-skip","qt3d","-skip","qt5compat","-skip","qtactiveqt","-skip","qtdoc",
          "-skip","qtcharts","-skip","qtcoap","-skip","qtconnectivity","-skip","qtdatavis3d",
          "-skip","qtgraphs","-skip","qtgrpc","-skip","qthttpserver","-skip","qtimageformats",
          "-skip","qtlanguageserver","-skip","qtlocation","-skip","qtlottie","-skip","qtpositioning",
          "-skip","qtquick3d","-skip","qtquick3dphysics","-skip","qtquickeffectmaker","-skip","qtquicktimeline",
          "-skip","qtremoteobjects","-skip","qtscxml","-skip","qtsensors","-skip","qtserialbus",
          "-skip","qtserialport","-skip","qtspeech","-skip","qttranslations","-skip","qtvirtualkeyboard",
          "-qt-zlib","-qt-libpng","-qt-libjpeg","-qt-freetype","-qt-harfbuzz","-qt-pcre",
          "-DFEATURE_system_libb2=OFF",
          "-platform", "${{ matrix.qt_platform }}",
          "-schannel"
        )
        Write-Host "Running configure.bat $cfg"
        & "..\$QT_SOURCE_REL\configure.bat" @cfg
        if ($LASTEXITCODE -ne 0) { if (Test-Path config.log) { Get-Content config.log }; throw "configure failed" }

        Write-Host "Building Qt modules..."
        cmake --build . --parallel $env:NUMBER_OF_PROCESSORS
        if ($LASTEXITCODE -ne 0) { throw "build failed" }

        Write-Host "Installing Qt..."
        cmake --install .
        if ($LASTEXITCODE -ne 0) { throw "install failed" }

    # --- Package and Upload Qt Build ---
    - name: Package Qt Build
      shell: bash
      run: |
        ARTIFACT_NAME="qt${{ matrix.qt_version }}-static-${{ matrix.name }}.zip"
        echo "Creating archive: $ARTIFACT_NAME from qt6-static-build/"
        cd "${{ github.workspace }}/kormix-app"
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          7z a "${{ github.workspace }}/$ARTIFACT_NAME" -r qt6-static-build/* || exit 1
        else
          zip -r "${{ github.workspace }}/$ARTIFACT_NAME" qt6-static-build || exit 1
        fi

    - name: Upload Qt Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: qt${{ matrix.qt_version }}-static-${{ matrix.name }}
        path: ${{ github.workspace }}/qt${{ matrix.qt_version }}-static-${{ matrix.name }}.zip


  create-release:
    name: Create Qt Release
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: qt*-static-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          repository: kormix-io/kormix-app
          files: artifacts/*
          tag_name: qt-static-rel5
          name: Qt Static Build Release 5 (Windows MinGW-w64)
          body: |
            Static Qt builds for multiple platforms
            
            Contains:
            - macOS Apple Silicon (arm64) - built on macos-14
            - macOS Intel (x86_64) - built on macos-14-large (host tools must match Intel CI)
            - Windows (x64)
        env:
          GITHUB_TOKEN: ${{ secrets.KORMIX_GH_ACCESS_TOKEN }}